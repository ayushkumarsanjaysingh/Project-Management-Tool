<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple E-commerce Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            background-color: #10B981;
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease-in-out;
            z-index: 50;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 90%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="text-gray-800">

    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center cursor-pointer" onclick="app.showPage('home')">
                    <i class="fas fa-shopping-bag text-indigo-600 text-2xl mr-2"></i>
                    <span class="font-bold text-xl tracking-tight text-gray-900">CodeAlpha Store</span>
                </div>
                
                <div class="flex items-center space-x-4">
                    <button id="userBtn" onclick="app.toggleLoginModal()" class="text-gray-600 hover:text-indigo-600 transition">
                        <i class="fas fa-user text-xl"></i>
                        <span id="userNameDisplay" class="hidden sm:inline-block ml-1 text-sm font-medium">Login</span>
                    </button>
                    
                    <button onclick="app.showPage('cart')" class="text-gray-600 hover:text-indigo-600 transition relative">
                        <i class="fas fa-shopping-cart text-xl"></i>
                        <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main id="mainContent" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 min-h-[calc(100vh-140px)]">
        <!-- Dynamic content will be loaded here -->
    </main>

    <footer class="bg-gray-800 text-white py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p>&copy; 2026 CodeAlpha Simple Store. All rights reserved.</p>
        </div>
    </footer>

    <div id="toast" class="toast">
        <div class="flex items-center">
            <i class="fas fa-check-circle mr-2"></i>
            <span id="toastMessage">Action successful!</span>
        </div>
    </div>

    <div id="authModal" class="modal">
        <div class="modal-content relative max-w-md">
            <button onclick="app.toggleLoginModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i class="fas fa-times text-xl"></i>
            </button>
            
            <div id="loginForm" class="p-4">
                <h2 class="text-2xl font-bold mb-6 text-center text-gray-900">Login</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="loginEmail" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" placeholder="user@example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="loginPassword" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" placeholder="••••••••">
                    </div>
                    <button onclick="app.login()" class="w-full bg-indigo-600 text-white rounded-md py-2 px-4 hover:bg-indigo-700 transition font-medium">Sign In</button>
                    <p class="text-center text-sm text-gray-600 mt-4">
                        Don't have an account? <a href="#" onclick="app.switchAuthMode('register')" class="text-indigo-600 hover:underline">Register</a>
                    </p>
                </div>
            </div>

            <div id="registerForm" class="p-4 hidden">
                <h2 class="text-2xl font-bold mb-6 text-center text-gray-900">Register</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Full Name</label>
                        <input type="text" id="regName" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="regEmail" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" placeholder="user@example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="regPassword" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" placeholder="••••••••">
                    </div>
                    <button onclick="app.register()" class="w-full bg-indigo-600 text-white rounded-md py-2 px-4 hover:bg-indigo-700 transition font-medium">Create Account</button>
                    <p class="text-center text-sm text-gray-600 mt-4">
                        Already have an account? <a href="#" onclick="app.switchAuthMode('login')" class="text-indigo-600 hover:underline">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mock Database
        const db = {
            products: [
                { id: 1, name: "Premium Wireless Headphones", price: 199.99, category: "Electronics", image: "https://placehold.co/400x300/3b82f6/white?text=Headphones", description: "High-quality noise-canceling wireless headphones with 30-hour battery life.", stock: 15 },
                { id: 2, name: "Minimalist Smartwatch", price: 149.50, category: "Electronics", image: "https://placehold.co/400x300/10b981/white?text=Smartwatch", description: "Sleek smartwatch with fitness tracking, heart rate monitor, and notifications.", stock: 8 },
                { id: 3, name: "Ergonomic Office Chair", price: 299.00, category: "Furniture", image: "https://placehold.co/400x300/f59e0b/white?text=Chair", description: "Comfortable ergonomic chair designed for long hours of desk work.", stock: 5 },
                { id: 4, name: "Mechanical Keyboard", price: 120.00, category: "Electronics", image: "https://placehold.co/400x300/6366f1/white?text=Keyboard", description: "RGB mechanical keyboard with tactile switches for gamers and typists.", stock: 20 },
                { id: 5, name: "Ceramic Coffee Mug", price: 18.99, category: "Home", image: "https://placehold.co/400x300/ec4899/white?text=Mug", description: "Hand-crafted 12oz ceramic coffee mug, microwave and dishwasher safe.", stock: 50 },
                { id: 6, name: "Canvas Backpack", price: 45.00, category: "Accessories", image: "https://placehold.co/400x300/8b5cf6/white?text=Backpack", description: "Durable canvas backpack with laptop sleeve, perfect for school or travel.", stock: 30 }
            ],
            users: [
                { email: "user@example.com", password: "password123", name: "Demo User" }
            ],
            orders: []
        };

        // Application State
        const state = {
            cart: [],
            currentUser: null,
            currentPage: 'home',
            currentProductId: null
        };

        const app = {
            init: function() {
                this.loadCart();
                this.checkAuth();
                this.showPage('home');
                
                // Close modal when clicking outside
                window.onclick = function(event) {
                    const modal = document.getElementById('authModal');
                    if (event.target == modal) {
                        modal.style.display = "none";
                    }
                }
            },

            // Navigation and Rendering
            showPage: function(page, id = null) {
                state.currentPage = page;
                const mainContent = document.getElementById('mainContent');
                mainContent.innerHTML = ''; // Clear current content

                switch(page) {
                    case 'home':
                        mainContent.innerHTML = this.renderHome();
                        break;
                    case 'product':
                        state.currentProductId = id;
                        mainContent.innerHTML = this.renderProductDetails(id);
                        break;
                    case 'cart':
                        mainContent.innerHTML = this.renderCart();
                        break;
                    case 'checkout':
                        if(!state.currentUser) {
                            this.showToast("Please login to checkout", "error");
                            this.toggleLoginModal();
                            this.showPage('cart');
                        } else {
                            mainContent.innerHTML = this.renderCheckout();
                        }
                        break;
                    case 'orderSuccess':
                        mainContent.innerHTML = this.renderOrderSuccess();
                        break;
                }
                window.scrollTo(0, 0);
            },

            renderHome: function() {
                let html = `
                    <div class="fade-in">
                        <div class="mb-8 text-center">
                            <h1 class="text-4xl font-extrabold text-gray-900 mb-4">Welcome to CodeAlpha Store</h1>
                            <p class="text-lg text-gray-600 max-w-2xl mx-auto">Find the best products at unbeatable prices.</p>
                        </div>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                `;

                db.products.forEach(product => {
                    html += `
                        <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition duration-300">
                            <img class="w-full h-48 object-cover cursor-pointer" src="${product.image}" alt="${product.name}" onclick="app.showPage('product', ${product.id})">
                            <div class="p-5">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="text-xl font-semibold text-gray-900 cursor-pointer hover:text-indigo-600 line-clamp-1" onclick="app.showPage('product', ${product.id})">${product.name}</h3>
                                </div>
                                <p class="text-gray-500 text-sm mb-4 line-clamp-2">${product.description}</p>
                                <div class="flex justify-between items-center mt-4">
                                    <span class="text-2xl font-bold text-gray-900">$${product.price.toFixed(2)}</span>
                                    <button onclick="app.addToCart(${product.id})" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-full p-2 w-10 h-10 flex items-center justify-center transition">
                                        <i class="fas fa-plus"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
                return html;
            },

            renderProductDetails: function(id) {
                const product = db.products.find(p => p.id === id);
                if (!product) return `<div class="text-center text-red-500 mt-10">Product not found.</div>`;

                return `
                    <div class="fade-in bg-white rounded-xl shadow-lg overflow-hidden max-w-5xl mx-auto">
                        <div class="md:flex">
                            <div class="md:flex-shrink-0 md:w-1/2">
                                <img class="h-full w-full object-cover md:h-96" src="${product.image}" alt="${product.name}">
                            </div>
                            <div class="p-8 md:w-1/2 flex flex-col justify-center">
                                <div class="uppercase tracking-wide text-sm text-indigo-500 font-semibold mb-1">${product.category}</div>
                                <h2 class="block mt-1 text-3xl leading-tight font-bold text-gray-900 mb-4">${product.name}</h2>
                                <p class="text-gray-600 mb-6 text-lg">${product.description}</p>
                                <div class="mb-6 flex items-center">
                                    <span class="text-3xl font-extrabold text-gray-900 mr-4">$${product.price.toFixed(2)}</span>
                                    <span class="text-sm ${product.stock > 0 ? 'text-green-500' : 'text-red-500'} font-medium">
                                        ${product.stock > 0 ? 'In Stock (' + product.stock + ')' : 'Out of Stock'}
                                    </span>
                                </div>
                                <div class="flex space-x-4">
                                    <button onclick="app.addToCart(${product.id})" class="flex-1 bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition flex items-center justify-center" ${product.stock === 0 ? 'disabled' : ''}>
                                        <i class="fas fa-cart-plus mr-2"></i> Add to Cart
                                    </button>
                                    <button onclick="app.showPage('home')" class="bg-gray-200 text-gray-800 px-6 py-3 rounded-lg font-semibold hover:bg-gray-300 transition">
                                        Back
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderCart: function() {
                if (state.cart.length === 0) {
                    return `
                        <div class="fade-in text-center py-20 bg-white rounded-xl shadow-sm">
                            <i class="fas fa-shopping-cart text-gray-300 text-6xl mb-4"></i>
                            <h2 class="text-2xl font-bold text-gray-700 mb-4">Your cart is empty</h2>
                            <button onclick="app.showPage('home')" class="bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700 transition">Start Shopping</button>
                        </div>
                    `;
                }

                let total = 0;
                let html = `
                    <div class="fade-in max-w-4xl mx-auto">
                        <h2 class="text-3xl font-bold text-gray-900 mb-8">Shopping Cart</h2>
                        <div class="bg-white shadow-md rounded-lg overflow-hidden">
                            <ul class="divide-y divide-gray-200">
                `;

                state.cart.forEach(item => {
                    const product = db.products.find(p => p.id === item.productId);
                    if(product) {
                        const itemTotal = product.price * item.quantity;
                        total += itemTotal;
                        html += `
                            <li class="p-6 flex flex-col sm:flex-row items-center sm:justify-between">
                                <div class="flex items-center w-full sm:w-auto mb-4 sm:mb-0">
                                    <img src="${product.image}" alt="${product.name}" class="w-20 h-20 object-cover rounded-md mr-6 cursor-pointer" onclick="app.showPage('product', ${product.id})">
                                    <div>
                                        <h3 class="text-lg font-semibold text-gray-900 cursor-pointer hover:text-indigo-600" onclick="app.showPage('product', ${product.id})">${product.name}</h3>
                                        <p class="text-gray-500">$${product.price.toFixed(2)} each</p>
                                    </div>
                                </div>
                                <div class="flex items-center justify-between w-full sm:w-auto space-x-6">
                                    <div class="flex items-center border rounded-md">
                                        <button onclick="app.updateQuantity(${item.productId}, -1)" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-l-md">-</button>
                                        <span class="px-4 py-1 font-medium">${item.quantity}</span>
                                        <button onclick="app.updateQuantity(${item.productId}, 1)" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-r-md">+</button>
                                    </div>
                                    <span class="font-bold text-lg w-24 text-right">$${itemTotal.toFixed(2)}</span>
                                    <button onclick="app.removeFromCart(${item.productId})" class="text-red-500 hover:text-red-700 p-2">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                            </li>
                        `;
                    }
                });

                html += `
                            </ul>
                            <div class="p-6 bg-gray-50 flex flex-col sm:flex-row justify-between items-center border-t border-gray-200">
                                <div class="mb-4 sm:mb-0 text-xl">
                                    <span class="text-gray-600">Subtotal:</span>
                                    <span class="font-bold text-gray-900 ml-2">$${total.toFixed(2)}</span>
                                </div>
                                <div class="flex space-x-4 w-full sm:w-auto">
                                    <button onclick="app.showPage('home')" class="flex-1 sm:flex-none px-6 py-3 bg-white border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 font-medium transition">Continue Shopping</button>
                                    <button onclick="app.showPage('checkout')" class="flex-1 sm:flex-none px-6 py-3 bg-indigo-600 rounded-md text-white hover:bg-indigo-700 font-medium transition shadow-sm">Proceed to Checkout</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                return html;
            },

            renderCheckout: function() {
                 let total = 0;
                 state.cart.forEach(item => {
                    const product = db.products.find(p => p.id === item.productId);
                    if(product) total += product.price * item.quantity;
                 });
                 const tax = total * 0.1; // 10% tax
                 const finalTotal = total + tax;

                return `
                    <div class="fade-in max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
                        <div class="md:col-span-2 space-y-6">
                            <div class="bg-white p-6 rounded-lg shadow-sm">
                                <h2 class="text-2xl font-bold text-gray-900 mb-6">Shipping Information</h2>
                                <form id="checkoutForm" class="space-y-4" onsubmit="event.preventDefault(); app.processOrder();">
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700">First Name</label>
                                            <input type="text" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700">Last Name</label>
                                            <input type="text" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700">Address</label>
                                        <input type="text" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                                    </div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700">City</label>
                                            <input type="text" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700">Postal Code</label>
                                            <input type="text" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                                        </div>
                                    </div>
                                    
                                    <h3 class="text-xl font-bold text-gray-900 mt-8 mb-4">Payment Details</h3>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700">Card Number (Mock)</label>
                                        <input type="text" required placeholder="0000 0000 0000 0000" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                                    </div>
                                    
                                    <button type="submit" class="w-full mt-6 bg-indigo-600 text-white rounded-md py-3 font-bold hover:bg-indigo-700 transition shadow-md">
                                        Place Order ($${finalTotal.toFixed(2)})
                                    </button>
                                </form>
                            </div>
                        </div>
                        
                        <div class="md:col-span-1">
                            <div class="bg-white p-6 rounded-lg shadow-sm sticky top-24">
                                <h3 class="text-lg font-bold text-gray-900 mb-4">Order Summary</h3>
                                <div class="space-y-3 mb-6 max-h-60 overflow-y-auto">
                                    ${state.cart.map(item => {
                                        const p = db.products.find(prod => prod.id === item.productId);
                                        return p ? `
                                            <div class="flex justify-between text-sm">
                                                <span class="text-gray-600 truncate mr-2">${item.quantity}x ${p.name}</span>
                                                <span class="font-medium text-gray-900">$${(p.price * item.quantity).toFixed(2)}</span>
                                            </div>
                                        ` : '';
                                    }).join('')}
                                </div>
                                <div class="border-t border-gray-200 pt-4 space-y-2">
                                    <div class="flex justify-between text-sm">
                                        <span class="text-gray-600">Subtotal</span>
                                        <span class="font-medium text-gray-900">$${total.toFixed(2)}</span>
                                    </div>
                                    <div class="flex justify-between text-sm">
                                        <span class="text-gray-600">Tax (10%)</span>
                                        <span class="font-medium text-gray-900">$${tax.toFixed(2)}</span>
                                    </div>
                                    <div class="flex justify-between text-lg font-bold mt-4 pt-4 border-t border-gray-200">
                                        <span>Total</span>
                                        <span>$${finalTotal.toFixed(2)}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderOrderSuccess: function() {
                const orderId = 'ORD-' + Math.floor(Math.random() * 1000000);
                return `
                    <div class="fade-in max-w-2xl mx-auto text-center py-16 bg-white rounded-xl shadow-md px-4">
                        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                            <i class="fas fa-check text-4xl text-green-500"></i>
                        </div>
                        <h2 class="text-3xl font-extrabold text-gray-900 mb-2">Order Confirmed!</h2>
                        <p class="text-gray-600 mb-8 text-lg">Thank you for your purchase, ${state.currentUser.name}.</p>
                        
                        <div class="bg-gray-50 p-6 rounded-lg mb-8 text-left border border-gray-200 inline-block w-full max-w-md mx-auto">
                            <p class="text-sm text-gray-500 mb-1">Order Number</p>
                            <p class="font-mono font-bold text-lg mb-4 text-gray-800">${orderId}</p>
                            <p class="text-sm text-gray-500 mb-1">Status</p>
                            <p class="font-medium text-indigo-600">Processing</p>
                        </div>
                        
                        <div>
                            <button onclick="app.showPage('home')" class="bg-indigo-600 text-white px-8 py-3 rounded-lg font-medium hover:bg-indigo-700 transition">
                                Continue Shopping
                            </button>
                        </div>
                    </div>
                `;
            },

            addToCart: function(productId) {
                const product = db.products.find(p => p.id === productId);
                if (!product) return;

                const existingItem = state.cart.find(item => item.productId === productId);
                
                if (existingItem) {
                    if (existingItem.quantity < product.stock) {
                        existingItem.quantity += 1;
                        this.showToast(`Added another ${product.name} to cart.`);
                    } else {
                        this.showToast("Cannot add more. Out of stock limit.", "error");
                        return;
                    }
                } else {
                    if(product.stock > 0) {
                        state.cart.push({ productId: productId, quantity: 1 });
                        this.showToast(`${product.name} added to cart!`);
                    } else {
                         this.showToast("Product is out of stock.", "error");
                         return;
                    }
                }
                
                this.saveCart();
                this.updateCartCount();
                if(state.currentPage === 'cart') this.showPage('cart'); // Refresh cart view if active
            },

            updateQuantity: function(productId, change) {
                const itemIndex = state.cart.findIndex(item => item.productId === productId);
                if (itemIndex > -1) {
                    const product = db.products.find(p => p.id === productId);
                    const newQuantity = state.cart[itemIndex].quantity + change;
                    
                    if (newQuantity > 0 && newQuantity <= product.stock) {
                        state.cart[itemIndex].quantity = newQuantity;
                    } else if (newQuantity === 0) {
                        this.removeFromCart(productId);
                        return; // removeFromCart handles save/update
                    } else if (newQuantity > product.stock) {
                         this.showToast("Maximum stock reached.", "error");
                         return;
                    }
                    this.saveCart();
                    this.updateCartCount();
                    this.showPage('cart'); // Refresh view
                }
            },

            removeFromCart: function(productId) {
                state.cart = state.cart.filter(item => item.productId !== productId);
                this.saveCart();
                this.updateCartCount();
                this.showPage('cart');
                this.showToast("Item removed from cart.");
            },

            updateCartCount: function() {
                const count = state.cart.reduce((total, item) => total + item.quantity, 0);
                const badge = document.getElementById('cartCount');
                badge.textContent = count;
                if(count > 0) {
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            },

            processOrder: function() {
                // Simulate order processing and database insertion
                const order = {
                    userId: state.currentUser.email,
                    items: [...state.cart],
                    date: new Date().toISOString(),
                    status: 'processing'
                };
                
                db.orders.push(order);
                
                // Clear cart
                state.cart = [];
                this.saveCart();
                this.updateCartCount();
                
                this.showPage('orderSuccess');
            },

            toggleLoginModal: function() {
                const modal = document.getElementById('authModal');
                if (state.currentUser) {
                    // If logged in, clicking the user button logs out (simple implementation)
                    this.logout();
                } else {
                    if (modal.style.display === "block") {
                        modal.style.display = "none";
                    } else {
                        modal.style.display = "block";
                        this.switchAuthMode('login');
                    }
                }
            },

            switchAuthMode: function(mode) {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.add('hidden');
                
                if (mode === 'login') {
                    document.getElementById('loginForm').classList.remove('hidden');
                } else {
                    document.getElementById('registerForm').classList.remove('hidden');
                }
            },

            login: function() {
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                
                const user = db.users.find(u => u.email === email && u.password === password);
                
                if (user) {
                    state.currentUser = { email: user.email, name: user.name };
                    sessionStorage.setItem('currentUser', JSON.stringify(state.currentUser));
                    this.updateUserUI();
                    document.getElementById('authModal').style.display = "none";
                    this.showToast(`Welcome back, ${user.name}!`);
                    
                    // Clear inputs
                    document.getElementById('loginEmail').value = '';
                    document.getElementById('loginPassword').value = '';
                    
                    if(state.currentPage === 'checkout') this.showPage('checkout'); // re-render if blocked
                } else {
                    this.showToast("Invalid email or password", "error");
                }
            },

            register: function() {
                const name = document.getElementById('regName').value;
                const email = document.getElementById('regEmail').value;
                const password = document.getElementById('regPassword').value;
                
                if (!name || !email || !password) {
                    this.showToast("Please fill all fields", "error");
                    return;
                }

                if (db.users.find(u => u.email === email)) {
                    this.showToast("Email already exists", "error");
                    return;
                }

                const newUser = { email, password, name };
                db.users.push(newUser);
                
                // Auto login
                state.currentUser = { email: newUser.email, name: newUser.name };
                sessionStorage.setItem('currentUser', JSON.stringify(state.currentUser));
                this.updateUserUI();
                
                document.getElementById('authModal').style.display = "none";
                this.showToast(`Account created successfully! Welcome, ${name}.`);
                
                // Clear inputs
                document.getElementById('regName').value = '';
                document.getElementById('regEmail').value = '';
                document.getElementById('regPassword').value = '';
            },

            logout: function() {
                state.currentUser = null;
                sessionStorage.removeItem('currentUser');
                this.updateUserUI();
                this.showToast("Logged out successfully.");
                if(state.currentPage === 'checkout' || state.currentPage === 'orderSuccess') {
                    this.showPage('home');
                }
            },

            checkAuth: function() {
                const storedUser = sessionStorage.getItem('currentUser');
                if (storedUser) {
                    state.currentUser = JSON.parse(storedUser);
                }
                this.updateUserUI();
            },

            updateUserUI: function() {
                const display = document.getElementById('userNameDisplay');
                const btn = document.getElementById('userBtn');
                if (state.currentUser) {
                    display.textContent = 'Logout';
                    btn.classList.add('text-indigo-600');
                    btn.title = `Logged in as ${state.currentUser.name}`;
                } else {
                    display.textContent = 'Login';
                    btn.classList.remove('text-indigo-600');
                    btn.title = 'Login';
                }
            },

            // Local Storage Helpers
            saveCart: function() {
                localStorage.setItem('shopCart', JSON.stringify(state.cart));
            },
            
            loadCart: function() {
                const saved = localStorage.getItem('shopCart');
                if (saved) {
                    try {
                        state.cart = JSON.parse(saved);
                    } catch(e) {
                        state.cart = [];
                    }
                }
                this.updateCartCount();
            },

            showToast: function(message, type = 'success') {
                const toast = document.getElementById('toast');
                const msgEl = document.getElementById('toastMessage');
                const icon = toast.querySelector('i');
                
                msgEl.textContent = message;
                
                if (type === 'error') {
                    toast.style.backgroundColor = '#EF4444'; // Red
                    icon.className = 'fas fa-exclamation-circle mr-2';
                } else {
                    toast.style.backgroundColor = '#10B981'; // Green
                    icon.className = 'fas fa-check-circle mr-2';
                }

                toast.classList.add('show');
                
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
        };

        // Initialize app on load
        window.onload = function() {
            app.init();
        };
    </script>
</body>
</html>
